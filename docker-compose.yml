services:
  # ── FastAPI Backend ──
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/security_db
      - REDIS_URL=redis://redis:6379
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:1.5b
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production-min-32-chars}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - SIEM_WEBHOOK_URL=${SIEM_WEBHOOK_URL:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ml_models:/app/app/ml/models
    restart: unless-stopped

  # ── Ollama (Qwen) ──
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          memory: 4G

  # ── Auto-pull Qwen model ──
  ollama-pull:
    image: curlimages/curl:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: >
      sh -c "
        echo '[SETUP] Checking if qwen2.5:1.5b model exists...' &&
        if curl -s http://ollama:11434/api/tags | grep -q qwen2.5:1.5b; then
          echo '[SETUP] qwen2.5:1.5b already downloaded, skipping.';
        else
          echo '[SETUP] Pulling qwen2.5:1.5b model (~1 GB)...' &&
          curl -X POST http://ollama:11434/api/pull -d '{\"name\": \"qwen2.5:1.5b\"}' &&
          echo '[SETUP] qwen2.5:1.5b model ready!';
        fi
      "
    restart: "no"

  # ── PostgreSQL 16 ──
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: security_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis 7 ──
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  ml_models:
  ollama_data:
