name: anti_tampering_apk
description: Multi-layer APK attack detection system with AI-powered threat analysis.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Security & Crypto
  crypto: ^3.0.3
  flutter_secure_storage: ^9.0.0
  pointycastle: ^3.7.4

  # HTTP & Networking
  dio: ^5.4.0

  # TFLite ML inference
  tflite_flutter: ^0.10.4

  # Device info
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0

  # State management
  provider: ^6.1.1

  # UI
  cupertino_icons: ^1.0.6
  fl_chart: ^0.68.0
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  animate_do: ^3.3.4

  # Utils
  uuid: ^4.3.3
  intl: ^0.19.0
  logger: ^2.0.2+1
  file_picker: ^10.3.10
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/
